# MkDocs configuration for the Selora IDE documentation site.
#
# These are the SOURCES (Phase 6e): `mkdocs build` produces the static site;
# deployment (GitHub Pages at https://selora-ide.selora.lol) is a v1.x step
# (RELEASE.md §7.3).

site_name: Selora IDE
site_description: The editor born connected to Selora — documentation.
site_url: https://selora-ide.selora.lol
repo_url: https://github.com/ToxicAngelX/Selora-IDE

# The pages live next to this config (docs/ at the repo root).
docs_dir: .

theme:
  name: readthedocs
  # The docs site is functional documentation, not app chrome; the app’s
  # design tokens (DESIGN_TOKENS.md) govern the IDE, not this site.

nav:
  - Home: index.md
  - Installation: installation.md
  - Getting started: getting-started.md
  - The editor: editor.md
  - Selora AI: ai.md
  - Agent Mode: agent-mode.md
  - Settings: settings.md
  - Keyboard shortcuts: keybinds.md
  - Walkthrough and checklist: WALKTHROUGH.md
  - Troubleshooting: troubleshooting.md

markdown_extensions:
  - admonition
  - toc:
      permalink: true
