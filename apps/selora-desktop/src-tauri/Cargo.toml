[package]
name = "selora-desktop"
description = "Tauri 2/WebView2 shell for Selora IDE (Z0/Z1 scaffold)"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
build = "build.rs"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
serde.workspace = true
serde_json.workspace = true
tauri = { version = "2", features = [] }
uuid.workspace = true
selora-protocol.workspace = true
selora-settings.workspace = true

# Z2 state tests drive `dispatch`'s emit path with `tauri::test::mock_app`
# (MockRuntime); the feature is an empty gate on the tauri crate itself.
[dev-dependencies]
tauri = { version = "2", features = ["test"] }

[[bin]]
name = "selora-desktop"
path = "src/main.rs"
