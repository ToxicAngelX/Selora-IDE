[package]
name = "selora-settings"
description = "JSON config read/write, keyring get/set (see PLAN.md §5)"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true

[dependencies]
serde.workspace = true
serde_json.workspace = true
egui.workspace = true
# OS keyring get/set for the API key (PLAN.md §5; ARCHITECTURE.md §7).
keyring.workspace = true

# The workspace error model (PLAN.md §8): load/save return
# `Result<T, SeloraError>`, which is defined in selora-core. selora-core is a
# stable Phase 1 leaf crate — depending on it here adds no parallel-build
# conflict (noted as a deviation from the brief's dependency list).
selora-core.workspace = true
