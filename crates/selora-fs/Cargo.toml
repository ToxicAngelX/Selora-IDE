[package]
name = "selora-fs"
description = "File tree traversal, fuzzy finder, search-in-files (see PLAN.md §5)"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true

[dependencies]
ignore = "0.4.33"
nucleo-matcher = "0.3.1"
# Regex search (the Search panel's `.*` toggle). Compiled in-process so an
# invalid pattern is a typed `SearchError::InvalidPattern`, never a
# subprocess stderr scrape.
regex = "1"
