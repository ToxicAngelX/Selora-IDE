[workspace]
resolver = "2"
members = [
    "crates/selora-core",
    "crates/selora-fs",
    "crates/selora-editor",
    "crates/selora-lsp",
    "crates/selora-git",
    "crates/selora-ai",
    "crates/selora-settings",
    "crates/selora-tokens",
    "crates/selora-ui",
    "crates/selora-app",
]

[workspace.package]
version = "0.1.0"
edition = "2021"
license = "MIT"
repository = "https://github.com/ToxicAngelX/Selora-IDE"
homepage = "https://github.com/ToxicAngelX/Selora-IDE"

[workspace.dependencies]
egui = "0.36"
eframe = "0.36"
# Buffer rope + shared types (selora-core).
ropey = "1.6"
thiserror = "2"
uuid = { version = "1", features = ["v4", "serde"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
# Networking (selora-ai): reqwest with rustls only — no OpenSSL on Windows (PLAN.md §4.7).
reqwest = { version = "0.12", default-features = false, features = ["rustls-tls", "json", "stream"] }
tokio = { version = "1", features = ["full"] }
futures-util = "0.3"
# Dev-only: mock gateway for selora-ai tests (ROADMAP.md Phase 1b).
wiremock = "0.6"

selora-core = { path = "crates/selora-core" }
selora-fs = { path = "crates/selora-fs" }
selora-editor = { path = "crates/selora-editor" }
selora-lsp = { path = "crates/selora-lsp" }
selora-git = { path = "crates/selora-git" }
selora-ai = { path = "crates/selora-ai" }
selora-settings = { path = "crates/selora-settings" }
selora-tokens = { path = "crates/selora-tokens" }
selora-ui = { path = "crates/selora-ui" }
selora-app = { path = "crates/selora-app" }

# Release profile per ARCHITECTURE.md §14.
[profile.release]
lto = "thin"
codegen-units = 1
strip = true
opt-level = 3
panic = "abort"
